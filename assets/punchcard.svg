<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160" viewBox="0 0 680 160" role="img">
<title>Punchcard</title><desc>punchcard hours vs weekday</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} .dot{opacity:0;animation:pop .3s forwards} @keyframes pop{to{opacity:1;transform:scale(1)}} </style>
<rect width="680" height="160" rx="16" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-family="monospace" font-size="12">PUNCHCARD — commits by weekday &amp; hour</text>
<g transform="translate(20,40)">
  <g font-family="monospace" font-size="8" fill="#7d8590">
    <text x="0" y="12">Mon</text><text x="0" y="28">Tue</text><text x="0" y="44">Wed</text>
  </g>
  <g transform="translate(40,0)">
    <circle cx="0" cy="8" r="6" fill="#216e39" class="dot" style="animation-delay:.05s"/>
    <circle cx="20" cy="8" r="4" fill="#30a14e" class="dot" style="animation-delay:.1s"/>
    <circle cx="40" cy="8" r="8" fill="#40c463" class="dot" style="animation-delay:.15s"/>
    <circle cx="60" cy="8" r="3" fill="#9be9a8" class="dot" style="animation-delay:.2s"/>
    <circle cx="0" cy="24" r="5" fill="#216e39" class="dot" style="animation-delay:.25s"/>
    <circle cx="40" cy="24" r="7" fill="#40c463" class="dot" style="animation-delay:.3s"/>
    <text x="80" y="16" fill="#7d8590" font-family="monospace" font-size="8">most productive: Wed 14h</text>
  </g>
</g>
</svg>
