<svg xmlns="http://www.w3.org/2000/svg" width="384" height="180" viewBox="0 0 384 180" role="img" aria-labelledby="title desc" xml:lang="ru">
  <title id="title">Рельеф — фосфор</title>
  <desc id="desc">Тот же горный хребет на координатной сетке: мятные изолинии и янтарный солнечный диск на тёмном экране.</desc>
  <style>
    :root { --paper: #102622; --ink: #ADF2CB; --spot: #FFD182; }
    .label { font: bold 12px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1.1px; fill: var(--ink); }
  </style>
  <defs>
    <clipPath id="screen"><rect x="16" y="34" width="352" height="92" rx="4"/></clipPath>
    <clipPath id="sun"><circle cx="291" cy="63" r="21"/></clipPath>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 16V0h16" fill="none" stroke="var(--ink)" stroke-width="1"/>
    </pattern>
    <path id="ridge" d="m10 111 45-13 27 6 32-21 21 8 43-37 34 35 27-16 37 27 26-10 36 20 35-13"/>
  </defs>
  <rect x="1" y="1" width="382" height="178" rx="7" fill="var(--paper)" stroke="var(--ink)"/>
  <text x="16" y="23" class="label">ПОЛЕВОЙ АТЛАС</text>
  <g fill="var(--spot)">
    <rect x="339" y="19" width="5" height="5"/><rect x="350" y="15" width="5" height="9"/><rect x="361" y="11" width="5" height="13"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="16" y="34" width="352" height="92" fill="url(#grid)" opacity=".29"/>
    <circle cx="291" cy="63" r="21" fill="var(--paper)" stroke="var(--spot)"/>
    <path clip-path="url(#sun)" d="M269 47h44m-44 4h44m-44 5h44m-44 6h44m-44 7h44m-44 8h44" stroke="var(--spot)" stroke-width="2"/>
    <g fill="none" stroke="var(--ink)" stroke-linejoin="round">
      <use href="#ridge" stroke-width="5" opacity=".19"/>
      <use href="#ridge" stroke-width="1.8"/>
      <use href="#ridge" transform="translate(0 12)" opacity=".75"/>
      <use href="#ridge" transform="translate(0 25)" opacity=".5"/>
      <use href="#ridge" transform="translate(0 39)" opacity=".3"/>
      <path d="m55 98-8 29m67-44-7 45m71-74-3 74m64-55 5 54m58-37 8 37" opacity=".45"/>
    </g>
    <circle cx="178" cy="54" r="3" fill="var(--spot)"/>
  </g>
  <rect x="16" y="34" width="352" height="92" rx="4" fill="none" stroke="var(--ink)" stroke-opacity=".5"/>
  <text x="15" y="163" fill="var(--ink)" style="font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: -1px">Рельеф</text>
  <text x="368" y="157" text-anchor="end" class="label" style="fill: var(--spot)">02 / ФОСФОР</text>
</svg>
