<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-labelledby="title desc" xml:lang="ru">
  <title id="title">Созвездие — шаблон README профиля</title>
  <desc id="desc">Звёздная карта с орбитой. Шаблон для работ, стека и контактов.</desc>
  <style>
    :root {
      --paper: #eef8f3; --field: #d6eee3; --ink: #153b30; --accent: #18654e;
      --rule: #83ac9c; --route: #25795e; --star: #fff1bf; --node: #226d57;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #142c27; --field: #1a3932; --ink: #f0fcf6; --accent: #a0e8c9;
        --rule: #628c7c; --route: #90d2b3; --star: #ffdc90; --node: #b2efd2;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .index { font: bold 12px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1.3px; }
    @media (prefers-reduced-motion: no-preference) {
      .route { stroke-dasharray: 1; animation: trace 1.6s ease-out both; }
      @keyframes trace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    }
  </style>
  <defs>
    <clipPath id="frame"><rect x="3" y="3" width="394" height="174" rx="14"/></clipPath>
    <path id="field" d="M245 0h155v180H219z"/>
    <pattern id="stars" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r=".9" fill="var(--rule)"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="400" height="180" fill="var(--paper)"/>
    <use href="#field" fill="var(--field)"/>
    <use href="#field" fill="url(#stars)" opacity=".8"/>
    <g fill="none" stroke="var(--rule)">
      <circle cx="314" cy="86" r="53" stroke-dasharray="2 4"/>
      <ellipse cx="314" cy="86" rx="73" ry="32" transform="rotate(-32 314 86)"/>
      <path d="M375 17v10m-5-5h10m-144 132v10m-5-5h10" stroke="var(--accent)" opacity=".75"/>
    </g>
    <!-- The constellation is complete even when animations are disabled. -->
    <g fill="none" stroke="var(--route)" stroke-linecap="round" stroke-linejoin="round">
      <path d="m247 109 38 14 29-37 39 28 22-43" stroke-dasharray="2 4"/>
      <path class="route" pathLength="1" d="m247 109 25-46 42 23 33-39 28 24" stroke-width="2.4"/>
    </g>
    <g fill="var(--node)" stroke="var(--field)" stroke-width="2">
      <circle cx="247" cy="109" r="4"/><circle cx="272" cy="63" r="5"/>
      <circle cx="347" cy="47" r="5"/><circle cx="375" cy="71" r="4"/>
      <circle cx="285" cy="123" r="3.5"/><circle cx="353" cy="114" r="3.5"/>
    </g>
    <g transform="translate(314 86)">
      <circle r="24" fill="var(--field)" stroke="var(--route)" stroke-dasharray="1 4"/>
      <path d="M0-21C2-7 7-2 21 0 7 2 2 7 0 21-2 7-7 2-21 0-7-2-2-7 0-21Z" fill="var(--star)" stroke="var(--node)" stroke-width="1.8"/>
      <circle r="3" fill="var(--node)"/>
    </g>
  </g>
  <rect x="3.5" y="3.5" width="393" height="173" rx="13.5" fill="none" stroke="var(--rule)"/>
  <g fill="var(--accent)">
    <circle cx="27" cy="26" r="4.5"/>
    <text x="41" y="31" class="index">02 / СОЗВЕЗДИЕ</text>
  </g>
  <g fill="var(--ink)">
    <text x="21" y="84" font-size="40" font-weight="700" letter-spacing="-1.8">Профиль</text>
    <text x="23" y="110" font-size="16">Работы, стек, контакты</text>
  </g>
  <path d="M23 129h171" stroke="var(--rule)" stroke-opacity=".7"/>
  <text x="23" y="155" fill="var(--accent)" font-size="15" font-weight="600">Открыть шаблон</text>
  <path d="M181 150h14m-6-6 6 6-6 6" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
