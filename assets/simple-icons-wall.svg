<svg xmlns="http://www.w3.org/2000/svg" width="680" height="140" viewBox="0 0 680 140" role="img">
<title>Simple Icons wall</title><desc>1856 icons → shields badges</desc>
<rect width="680" height="140" rx="16" fill="#020617"/>
<text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">SIMPLE-ICON-BADGES — 1856 icons → shields</text>
<g transform="translate(20,44)" font-family="monospace" font-size="9">
  <rect width="92" height="20" rx="4" fill="#3776AB"/><text x="46" y="13" text-anchor="middle" fill="white">python</text>
  <g transform="translate(100,0)"><rect width="92" height="20" rx="4" fill="#3178C6"/><text x="46" y="13" text-anchor="middle" fill="white">typescript</text></g>
  <g transform="translate(200,0)"><rect width="92" height="20" rx="4" fill="#000"/><text x="46" y="13" text-anchor="middle" fill="white">rust</text></g>
  <g transform="translate(300,0)"><rect width="92" height="20" rx="4" fill="#F7DF1E"/><text x="46" y="13" text-anchor="middle" fill="black">javascript</text></g>
  <g transform="translate(400,0)"><rect width="92" height="20" rx="4" fill="#EA7600"/><text x="46" y="13" text-anchor="middle" fill="white">blender</text></g>
  <text x="0" y="44" fill="#64748b" font-size="8">danmadeira/simple-icon-badges · shields.io/badge/{title}-{color}?logo={logo}</text>
</g>
</svg>
