<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" role="img">
<title>Snake full</title><desc>snake eats contribution path 3s loop</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} @keyframes pathdraw{from{stroke-dashoffset:800}to{stroke-dashoffset:0}} .snake-path{stroke-dasharray:800;stroke-dashoffset:800;animation:pathdraw 3s forwards}</style>
<rect width="680" height="180" rx="16" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-family="monospace" font-size="12">SNAKE FULL — Platane/snk style · output branch</text>
<g transform="translate(20,40)">
  <!-- grid 14*7? simplified 10 cells row -->
  <g fill="#161b22" stroke="#21262d">
    <rect x="0" y="0" width="18" height="18" rx="3"/><rect x="22" y="0" width="18" height="18" rx="3" fill="#0e4429"/>
    <rect x="44" y="0" width="18" height="18" rx="3" fill="#006d32"/><rect x="66" y="0" width="18" height="18" rx="3" fill="#26a641"/>
    <rect x="88" y="0" width="18" height="18" rx="3"/><rect x="110" y="0" width="18" height="18" rx="3" fill="#39d353"/>
  </g>
  <path d="M9 9 L 31 9 L 53 9 L 75 9 L 97 9" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" class="snake-path"/>
  <circle r="6" fill="#facc15"><animateMotion dur="3s" repeatCount="indefinite" path="M9 9 L31 9 L53 9 L75 9 L97 9"/></circle>
  <text x="0" y="46" fill="#7d8590" font-family="monospace" font-size="8">Action: Platane/snk → output branch · dark/light</text>
</g>
<g font-family="monospace" font-size="9">
  <text x="20" y="164" fill="#7d8590">schedule: cron 0 0 * * * + workflow_dispatch · uses Platane/snk@v3</text>
</g>
</svg>
