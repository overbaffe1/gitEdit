<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="sans-serif" fill="#203238"><text x="20" y="22" font-size="6">SAME GROUP RATES / DIFFERENT MIX</text><text x="20" y="40" font-size="3.7">Synthetic task outcomes. A4 / print at 100%.</text><text x="20" y="52" font-size="3.7">Method A: easy 9 / 10 = 90%; hard 27 / 90 = 30%.</text><text x="20" y="64" font-size="3.7">Method B: easy 72 / 90 = 80%; hard 2 / 10 = 20%.</text><text x="20" y="76" font-size="3.7">A wins in BOTH groups.</text><text x="20" y="88" font-size="3.7">Totals: A 36 / 100 = 36%; B 74 / 100 = 74%.</text><text x="20" y="100" font-size="3.7">Why? A gets 90 hard tasks; B gets only 10.</text><text x="20" y="112" font-size="3.7">A total = 0.1 x 90% + 0.9 x 30% = 36%.</text><text x="20" y="124" font-size="3.7">B total = 0.9 x 80% + 0.1 x 20% = 74%.</text><text x="20" y="136" font-size="3.7">Now use equal weights: half easy, half hard.</text><text x="20" y="148" font-size="3.7">A standardized = 0.5 x 90% + 0.5 x 30% = 60%.</text><text x="20" y="160" font-size="3.7">B standardized = 0.5 x 80% + 0.5 x 20% = 50%.</text><text x="20" y="172" font-size="3.7">Standardized rates are NOT new observations.</text><text x="20" y="184" font-size="3.7">Neither table alone proves a causal effect.</text><text x="20" y="196" font-size="3.7">Try a common easy-task weight w between 0 and 1:</text><text x="20" y="208" font-size="3.7">A = 30% + 60w percentage points.</text><text x="20" y="220" font-size="3.7">B = 20% + 60w percentage points.</text><text x="20" y="232" font-size="3.7">The common-weight gap is always 10 percentage points.</text></g></svg>
