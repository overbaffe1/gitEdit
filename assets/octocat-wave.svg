<svg xmlns="http://www.w3.org/2000/svg" width="680" height="120" viewBox="0 0 680 120" role="img">
<title>Octocat wave</title><desc>octocat waving</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}} .arm{animation:wave .8s infinite;transform-origin:80px 60px}</style>
<rect width="680" height="120" rx="16" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-family="monospace" font-size="12">OCTOCAT — waving arm 0.8s</text>
<g transform="translate(40,40)">
  <circle r="28" cx="60" cy="36" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="42" text-anchor="middle" font-size="24">🐙</text>
  <g class="arm"><text x="80" y="48" font-size="14">👋</text></g>
  <text x="110" y="20" fill="#e6edf3" font-family="monospace" font-size="11">Hi, I'm gitEdit!</text>
  <text x="110" y="36" fill="#7d8590" font-family="monospace" font-size="9">octocat from github.com/logos · wave via transform rotate</text>
</g>
</svg>
