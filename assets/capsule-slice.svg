<svg xmlns="http://www.w3.org/2000/svg" width="680" height="120" viewBox="0 0 680 120" role="img">
<title>Capsule slice/cylinder</title><desc>two more capsule types</desc>
<rect width="680" height="120" rx="16" fill="#0f172a"/>
<text x="20" y="24" fill="#e2e8f0" font-family="monospace" font-size="12">CAPSULE — slice / cylinder · 3 types of capsule-render</text>
<g transform="translate(20,36)">
  <path d="M0 0 L 320 0 L 300 44 L 0 44 Z" fill="url(#g1)"/><text x="150" y="26" text-anchor="middle" fill="white" font-family="monospace" font-size="11">type=slice</text>
  <g transform="translate(340,0)"><rect width="320" height="44" rx="22" fill="url(#g2)"/><text x="160" y="26" text-anchor="middle" fill="white" font-family="monospace" font-size="11">type=cylinder</text></g>
  <defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs>
</g>
<text x="20" y="104" fill="#64748b" font-family="monospace" font-size="9">capsule-render.vercel.app/api?type=slice|cylinder|waving|transparent|rect|soft|shark</text>
