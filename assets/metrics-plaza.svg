<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160" viewBox="0 0 680 160" role="img">
<title>Metrics plaza</title><desc>lines of code isocalendar</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} .bar{animation:grow .6s forwards;transform:scaleY(0);transform-origin:bottom} @keyframes grow{to{transform:scaleY(1)}}</style>
<rect width="680" height="160" rx="16" fill="#0f172a"/>
<text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">METRICS — isocalendar · habits · lines</text>
<g transform="translate(20,44)">
  <rect width="640" height="80" rx="8" fill="#020617" stroke="#1e293b"/>
  <g transform="translate(10,10)">
    <rect class="bar" x="0" y="20" width="10" height="30" rx="2" fill="#22c55e" style="animation-delay:.05s"/>
    <rect class="bar" x="14" y="30" width="10" height="20" rx="2" fill="#16a34a" style="animation-delay:.1s"/>
    <rect class="bar" x="28" y="10" width="10" height="40" rx="2" fill="#15803d" style="animation-delay:.15s"/>
    <rect class="bar" x="42" y="25" width="10" height="25" rx="2" fill="#4ade80" style="animation-delay:.2s"/>
    <text x="70" y="18" fill="#e2e8f0" font-family="monospace" font-size="10">1.2k lines · monomaniac · notanumber</text>
    <text x="70" y="32" fill="#94a3b8" font-family="monospace" font-size="9">lowlighter/metrics style · isocalendar plugin</text>
  </g>
</g>
</svg>
