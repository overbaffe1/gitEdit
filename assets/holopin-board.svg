<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" role="img">
<title>Holopin board</title><desc>6 badges shelf pop</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} .badge{opacity:0;animation:pop .3s forwards} @keyframes pop{0%{transform:scale(.8)}100%{opacity:1;transform:scale(1)}}</style>
<rect width="680" height="180" rx="16" fill="#0c0a09"/>
<text x="20" y="28" fill="#e7e5e4" font-family="monospace" font-size="12">HOLOPIN — badge board · holopin.io/@you</text>
<g transform="translate(20,40)">
  <g class="badge" style="animation-delay:.0s"><rect x="0" y="0" width="92" height="92" rx="12" fill="#1e40af" stroke="#44403c"/><text x="46" y="52" text-anchor="middle" font-size="28">🏅</text><text x="46" y="76" text-anchor="middle" fill="white" font-family="monospace" font-size="7">BADGE 1</text></g>
  <g class="badge" style="animation-delay:.12s"><rect x="104" y="0" width="92" height="92" rx="12" fill="#047857" stroke="#44403c"/><text x="150" y="52" text-anchor="middle" font-size="28">🎖️</text><text x="150" y="76" text-anchor="middle" fill="white" font-family="monospace" font-size="7">BADGE 2</text></g>
  <g class="badge" style="animation-delay:.24s"><rect x="208" y="0" width="92" height="92" rx="12" fill="#7c3aed" stroke="#44403c"/><text x="254" y="52" text-anchor="middle" font-size="28">🏆</text><text x="254" y="76" text-anchor="middle" fill="white" font-family="monospace" font-size="7">BADGE 3</text></g>
  <g class="badge" style="animation-delay:.36s"><rect x="312" y="0" width="92" height="92" rx="12" fill="#be123c" stroke="#44403c"/><text x="358" y="52" text-anchor="middle" font-size="28">💎</text><text x="358" y="76" text-anchor="middle" fill="white" font-family="monospace" font-size="7">BADGE 4</text></g>
  <g class="badge" style="animation-delay:.48s"><rect x="416" y="0" width="92" height="92" rx="12" fill="#0369a1" stroke="#44403c"/><text x="462" y="52" text-anchor="middle" font-size="28">🚀</text><text x="462" y="76" text-anchor="middle" fill="white" font-family="monospace" font-size="7">BADGE 5</text></g>
  <g class="badge" style="animation-delay:.60s"><rect x="520" y="0" width="92" height="92" rx="12" fill="#a16207" stroke="#44403c"/><text x="566" y="52" text-anchor="middle" font-size="28">🌟</text><text x="566" y="76" text-anchor="middle" fill="white" font-family="monospace" font-size="7">BADGE 6</text></g>
  <text x="0" y="120" fill="#a8a29e" font-family="monospace" font-size="10">collect → board → embed</text>
</g>
</svg>
