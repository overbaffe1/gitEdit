<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160" viewBox="0 0 680 160" role="img">
<title>Таймлайн пути</title><desc>Линия прогресса зажигает вехи одну за другой.</desc>
<rect width="680" height="160" rx="14" fill="#020617"/>
<line x1="40" y1="80" x2="640" y2="80" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
<line x1="40" y1="80" x2="640" y2="80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="600" stroke-dashoffset="600">
  <animate attributeName="stroke-dashoffset" values="600;0" dur="2.8s" fill="freeze"/>
</line>
<g font-family="system-ui, sans-serif">
  <g transform="translate(80,80)"><circle r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text y="5" text-anchor="middle" font-size="9" fill="white">23</text><text y="34" text-anchor="middle" font-size="8" fill="#94a3b8">старт</text><circle r="12" fill="none" stroke="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/></circle></g>
  <g transform="translate(220,80)"><circle r="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text y="5" text-anchor="middle" font-size="9" fill="white">24</text><text y="34" text-anchor="middle" font-size="8" fill="#94a3b8">OMLP</text><circle r="12" fill="none" stroke="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/></circle></g>
  <g transform="translate(360,80)"><circle r="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text y="5" text-anchor="middle" font-size="9" fill="white">25</text><text y="34" text-anchor="middle" font-size="8" fill="#94a3b8">CosmoH</text><circle r="12" fill="none" stroke="#34d399" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/></circle></g>
  <g transform="translate(520,80)"><circle r="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text y="5" text-anchor="middle" font-size="8" fill="white">26</text><text y="34" text-anchor="middle" font-size="8" fill="#94a3b8">MyWork</text><circle r="12" fill="none" stroke="#fbbf24" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.4s" fill="freeze"/></circle></g>
</g>
<text x="340" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#475569">journey · line 2.8s · dots pop 0.3s each</text>
<style>@media(prefers-reduced-motion:reduce){ animate{display:none} [stroke-dashoffset="600"]{stroke-dashoffset:0}}</style>
</svg>
