<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" role="img">
<title>Heatmap iso</title><desc>iso cubes height log count</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} .cube{transform-origin:bottom;transform:scaleY(0);animation:grow .5s forwards} @keyframes grow{to{transform:scaleY(1)}}</style>
<rect width="680" height="180" rx="16" fill="#0b1220"/>
<text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">ISOMETRIC HEATMAP — each day = cube</text>
<g transform="translate(20,50)">
  <g class="cube" style="animation-delay:.02s" transform="translate(0,0)"><rect width="36" height="18" rx="2" fill="#1e293b"/><rect width="36" height="14" y="4" rx="1" fill="#14532d"/></g>
  <g class="cube" style="animation-delay:.04s" transform="translate(48,0)"><rect width="36" height="18" rx="2" fill="#1e293b"/><rect width="36" height="20" y="-2" rx="1" fill="#16a34a"/></g>
  <g class="cube" style="animation-delay:.06s" transform="translate(96,0)"><rect width="36" height="18" rx="2" fill="#1e293b"/><rect width="36" height="26" y="-8" rx="1" fill="#22c55e"/></g>
  <g class="cube" style="animation-delay:.08s" transform="translate(144,0)"><rect width="36" height="18" rx="2" fill="#1e293b"/><rect width="36" height="32" y="-14" rx="1" fill="#4ade80"/></g>
</g>
</svg>
