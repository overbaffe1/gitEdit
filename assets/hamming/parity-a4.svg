<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="sans-serif" fill="#202638"><text x="20" y="20" font-size="6">HAMMING (7,4) / PARITY CARD</text><text x="20" y="32" font-size="4">Positions go left to right. Even parity. Print A4 at 100%.</text><text x="48" y="53" text-anchor="middle" font-size="5">1</text><rect x="40" y="60" width="16" height="16" fill="none" stroke="#202638" stroke-width=".3"/><circle cx="48" cy="100" r="4" fill="#e6ab97" stroke="#202638" stroke-width=".3"/><text x="70" y="53" text-anchor="middle" font-size="5">2</text><rect x="62" y="60" width="16" height="16" fill="none" stroke="#202638" stroke-width=".3"/><circle cx="70" cy="122" r="4" fill="#9dcbbc" stroke="#202638" stroke-width=".3"/><text x="92" y="53" text-anchor="middle" font-size="5">3</text><rect x="84" y="60" width="16" height="16" fill="none" stroke="#202638" stroke-width=".3"/><circle cx="92" cy="100" r="4" fill="#e6ab97" stroke="#202638" stroke-width=".3"/><circle cx="92" cy="122" r="4" fill="#9dcbbc" stroke="#202638" stroke-width=".3"/><text x="114" y="53" text-anchor="middle" font-size="5">4</text><rect x="106" y="60" width="16" height="16" fill="none" stroke="#202638" stroke-width=".3"/><circle cx="114" cy="144" r="4" fill="#b3afe2" stroke="#202638" stroke-width=".3"/><text x="136" y="53" text-anchor="middle" font-size="5">5</text><rect x="128" y="60" width="16" height="16" fill="none" stroke="#202638" stroke-width=".3"/><circle cx="136" cy="100" r="4" fill="#e6ab97" stroke="#202638" stroke-width=".3"/><circle cx="136" cy="144" r="4" fill="#b3afe2" stroke="#202638" stroke-width=".3"/><text x="158" y="53" text-anchor="middle" font-size="5">6</text><rect x="150" y="60" width="16" height="16" fill="none" stroke="#202638" stroke-width=".3"/><circle cx="158" cy="122" r="4" fill="#9dcbbc" stroke="#202638" stroke-width=".3"/><circle cx="158" cy="144" r="4" fill="#b3afe2" stroke="#202638" stroke-width=".3"/><text x="180" y="53" text-anchor="middle" font-size="5">7</text><rect x="172" y="60" width="16" height="16" fill="none" stroke="#202638" stroke-width=".3"/><circle cx="180" cy="100" r="4" fill="#e6ab97" stroke="#202638" stroke-width=".3"/><circle cx="180" cy="122" r="4" fill="#9dcbbc" stroke="#202638" stroke-width=".3"/><circle cx="180" cy="144" r="4" fill="#b3afe2" stroke="#202638" stroke-width=".3"/><text x="20" y="102" font-size="5">S1</text><text x="20" y="124" font-size="5">S2</text><text x="20" y="146" font-size="5">S4</text><text x="20" y="177" font-size="3.8">Data goes into positions 3, 5, 6, 7.</text><text x="20" y="187" font-size="3.8">Choose parity bits 1, 2, 4 to make each row even.</text><text x="20" y="197" font-size="3.8">Receiver: count the 1 bits in each coloured row.</text><text x="20" y="207" font-size="3.8">Odd row: S = 1. Even row: S = 0.</text><text x="20" y="217" font-size="3.8">Read syndrome as binary S4 S2 S1.</text><text x="20" y="227" font-size="3.8">If at most one error occurred: flip that position.</text><text x="20" y="237" font-size="3.8">Syndrome 0: do not flip anything.</text><text x="20" y="247" font-size="3.8">Warning: two errors can cause a wrong correction.</text><text x="20" y="257" font-size="3.8">This is (7,4), NOT extended (8,4) SECDED.</text></g></svg>
