<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" role="img">
<title>Social preview</title><desc>OG image 1280x640</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} @keyframes shine{from{transform:translateX(-200px)}to{transform:translateX(700px)}} .sh{animation:shine 2s 1s forwards}</style>
<rect width="680" height="150" rx="16" fill="#020617"/>
<text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">SOCIAL PREVIEW — OG image 1280×640</text>
<g transform="translate(20,40)">
  <rect width="640" height="90" rx="10" fill="#0f172a" stroke="#38bdf8"/>
  <text x="20" y="32" fill="white" font-family="monospace" font-size="18" font-weight="800">gitEdit</text>
  <text x="20" y="52" fill="#94a3b8" font-family="monospace" font-size="11">мастерская оформления README — склад крутого в git</text>
  <rect x="-200" y="0" width="120" height="90" fill="white" opacity="0.08" class="sh" transform="skewX(-12)"/>
</g>
</svg>
