<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="sans-serif"><text x="20" y="20" font-size="6">32 LIGHTS / PAPER LOOP</text><text x="20" y="32" font-size="3.7">A4, print 100%. Cells: 10 mm. Read in arrow direction.</text><text x="20" y="46" font-size="4">Strip 1 / positions 0..7 / read right</text><rect x="20" y="50" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="25" y="57" text-anchor="middle" font-size="5" fill="white">0</text><rect x="30" y="50" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="35" y="57" text-anchor="middle" font-size="5" fill="black">1</text><rect x="40" y="50" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="45" y="57" text-anchor="middle" font-size="5" fill="white">0</text><rect x="50" y="50" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="55" y="57" text-anchor="middle" font-size="5" fill="white">0</text><rect x="60" y="50" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="65" y="57" text-anchor="middle" font-size="5" fill="white">0</text><rect x="70" y="50" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="75" y="57" text-anchor="middle" font-size="5" fill="black">1</text><rect x="80" y="50" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="85" y="57" text-anchor="middle" font-size="5" fill="black">1</text><rect x="90" y="50" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="95" y="57" text-anchor="middle" font-size="5" fill="white">0</text><rect x="100" y="50" width="10" height="10" fill="none" stroke="black" stroke-dasharray="1 1" stroke-width=".2"/><text x="101" y="56" font-size="2.7">TAPE</text><text x="20" y="81" font-size="4">Strip 2 / positions 8..15 / read right</text><rect x="20" y="85" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="25" y="92" text-anchor="middle" font-size="5" fill="white">0</text><rect x="30" y="85" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="35" y="92" text-anchor="middle" font-size="5" fill="black">1</text><rect x="40" y="85" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="45" y="92" text-anchor="middle" font-size="5" fill="white">0</text><rect x="50" y="85" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="55" y="92" text-anchor="middle" font-size="5" fill="black">1</text><rect x="60" y="85" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="65" y="92" text-anchor="middle" font-size="5" fill="white">0</text><rect x="70" y="85" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="75" y="92" text-anchor="middle" font-size="5" fill="white">0</text><rect x="80" y="85" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="85" y="92" text-anchor="middle" font-size="5" fill="black">1</text><rect x="90" y="85" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="95" y="92" text-anchor="middle" font-size="5" fill="black">1</text><rect x="100" y="85" width="10" height="10" fill="none" stroke="black" stroke-dasharray="1 1" stroke-width=".2"/><text x="101" y="91" font-size="2.7">TAPE</text><text x="20" y="116" font-size="4">Strip 3 / positions 16..23 / read right</text><rect x="20" y="120" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="25" y="127" text-anchor="middle" font-size="5" fill="black">1</text><rect x="30" y="120" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="35" y="127" text-anchor="middle" font-size="5" fill="white">0</text><rect x="40" y="120" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="45" y="127" text-anchor="middle" font-size="5" fill="black">1</text><rect x="50" y="120" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="55" y="127" text-anchor="middle" font-size="5" fill="white">0</text><rect x="60" y="120" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="65" y="127" text-anchor="middle" font-size="5" fill="black">1</text><rect x="70" y="120" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="75" y="127" text-anchor="middle" font-size="5" fill="black">1</text><rect x="80" y="120" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="85" y="127" text-anchor="middle" font-size="5" fill="white">0</text><rect x="90" y="120" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="95" y="127" text-anchor="middle" font-size="5" fill="black">1</text><rect x="100" y="120" width="10" height="10" fill="none" stroke="black" stroke-dasharray="1 1" stroke-width=".2"/><text x="101" y="126" font-size="2.7">TAPE</text><text x="20" y="151" font-size="4">Strip 4 / positions 24..31 / read right</text><rect x="20" y="155" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="25" y="162" text-anchor="middle" font-size="5" fill="black">1</text><rect x="30" y="155" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="35" y="162" text-anchor="middle" font-size="5" fill="black">1</text><rect x="40" y="155" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="45" y="162" text-anchor="middle" font-size="5" fill="black">1</text><rect x="50" y="155" width="10" height="10" fill="#ead6b3" stroke="black" stroke-width=".2"/><text x="55" y="162" text-anchor="middle" font-size="5" fill="black">1</text><rect x="60" y="155" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="65" y="162" text-anchor="middle" font-size="5" fill="white">0</text><rect x="70" y="155" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="75" y="162" text-anchor="middle" font-size="5" fill="white">0</text><rect x="80" y="155" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="85" y="162" text-anchor="middle" font-size="5" fill="white">0</text><rect x="90" y="155" width="10" height="10" fill="#36535f" stroke="black" stroke-width=".2"/><text x="95" y="162" text-anchor="middle" font-size="5" fill="white">0</text><rect x="100" y="155" width="10" height="10" fill="none" stroke="black" stroke-dasharray="1 1" stroke-width=".2"/><text x="101" y="161" font-size="2.7">TAPE</text><text x="20" y="210" font-size="4">Cut the 4 strips including their tape tabs.</text><text x="20" y="220" font-size="4">Join 1 to 2 to 3 to 4 to 1. Tabs go UNDER the next strip.</text><text x="20" y="230" font-size="4">Do not count a tape tab as a bit. Read 5 consecutive cells.</text><text x="20" y="247" font-size="4">A 50 mm window selects exactly five cells.</text><rect x="20" y="255" width="50" height="10" fill="none" stroke="black" stroke-width=".2"/><text x="20" y="278" font-size="3.5">Optional: cut a matching window in separate scrap paper.</text></g></svg>
