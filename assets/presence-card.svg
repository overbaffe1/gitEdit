<svg xmlns="http://www.w3.org/2000/svg" width="680" height="140" viewBox="0 0 680 140" role="img">
<title>Presence card</title><desc>spotify + coding</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} @keyframes bar{0%,100%{height:8px}50%{height:18px}} .b{animation:bar .8s infinite}</style>
<rect width="680" height="140" rx="16" fill="#0f172a"/>
<text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">NOW PLAYING — Spotify · presence</text>
<g transform="translate(20,44)">
  <rect width="320" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="12" y="12" width="52" height="52" rx="6" fill="#22c55e"/>
  <text x="76" y="28" fill="#e2e8f0" font-family="monospace" font-size="11">Lo-fi beats to code to</text>
  <text x="76" y="44" fill="#94a3b8" font-family="monospace" font-size="9">Chillhop Music • 2:34 / 3:45</text>
  <g transform="translate(76,52)">
    <rect width="160" height="4" rx="2" fill="#334155"/><rect width="94" height="4" rx="2" fill="#22c55e"/>
    <rect x="0" y="-10" width="3" height="12" rx="1" fill="#22c55e" class="b" style="animation-delay:.0s"/>
    <rect x="10" y="-10" width="3" height="8" rx="1" fill="#22c55e" class="b" style="animation-delay:.15s"/>
    <rect x="20" y="-10" width="3" height="14" rx="1" fill="#22c55e" class="b" style="animation-delay:.30s"/>
  </g>
</g>
<g transform="translate(360,44)">
  <rect width="300" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="12" y="22" fill="#94a3b8" font-family="monospace" font-size="10">CODING</text>
  <text x="12" y="38" fill="#e2e8f0" font-family="monospace" font-size="11">gitEdit — README.md</text>
  <text x="12" y="56" fill="#64748b" font-family="monospace" font-size="9">VS Code • 34m • Python</text>
</g>
</svg>
