<svg xmlns="http://www.w3.org/2000/svg" width="560" height="80" viewBox="0 0 560 80" role="img" aria-labelledby="t">
  <title id="t">Неоновые пилюли — выбирай кейс</title>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="560" height="80" rx="16" fill="#0a0a0f"/>
  <!-- pill 1 -->
  <a href="assets/crystal-wipe.gif">
    <g filter="url(#softGlow)">
      <rect x="14" y="18" width="168" height="44" rx="22" fill="url(#g1)"/>
      <rect x="15.5" y="19.5" width="165" height="41" rx="20.5" fill="#0f172a" stroke="white" stroke-opacity="0.12"/>
    </g>
    <text x="98" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white">◈ КЕЙС</text>
    <text x="98" y="46" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#c4b5fd">CRYSTAL · WIPE</text>
  </a>
  <!-- pill 2 -->
  <a href="assets/repo-fingerprint.svg">
    <g filter="url(#softGlow)">
      <rect x="196" y="18" width="168" height="44" rx="22" fill="url(#g2)"/>
      <rect x="197.5" y="19.5" width="165" height="41" rx="20.5" fill="#0f172a" stroke="white" stroke-opacity="0.12"/>
    </g>
    <text x="280" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white">⬢ ОТПЕЧАТОК</text>
    <text x="280" y="46" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#fbcfe8">REPO · MAP</text>
  </a>
  <!-- pill 3 -->
  <a href="https://rawcdn.githack.com/overbaffe1/gitEdit/7b8b2cb05c77223867c772de0d411330f1eddc9f/docs/index.html">
    <g filter="url(#softGlow)">
      <rect x="378" y="18" width="168" height="44" rx="22" fill="url(#g3)"/>
      <rect x="379.5" y="19.5" width="165" height="41" rx="20.5" fill="#0f172a" stroke="white" stroke-opacity="0.12"/>
    </g>
    <text x="462" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white">⬣ 3D СТУДИЯ</text>
    <text x="462" y="46" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#a7f3d0">GLB · VIEWER</text>
  </a>
  <style>
    a { cursor: pointer; }
    a rect:last-of-type { transition: stroke-opacity 0.2s; }
    a:hover rect:last-of-type { stroke-opacity: 0.35; }
    @media (prefers-reduced-motion: no-preference) {
      a { animation: float 4s ease-in-out infinite; }
      a:nth-child(2) { animation-delay: 0.3s; }
      a:nth-child(3) { animation-delay: 0.6s; }
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.5px)} }
  </style>
</svg>
