<svg xmlns="http://www.w3.org/2000/svg" width="680" height="140" viewBox="0 0 680 140" role="img">
<title>Charset showcase</title><desc>classic vs blocks vs braille</desc>
<rect width="680" height="140" rx="16" fill="#0f172a"/>
<text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">CHARSET SHOWCASE — classic · blocks · braille · binary</text>
<g font-family="monospace" font-size="10">
  <text x="20" y="52" fill="#e2e8f0">classic:  .:-=+*#%@</text>
  <text x="20" y="68" fill="#94a3b8">blocks:   ▁▂▃▄▅▆▇█</text>
  <text x="20" y="84" fill="#a5b4fc">braille:  ⠀⠁⠃⠇⠏⠟⠿</text>
  <text x="20" y="100" fill="#fde68a">binary:   0101 1010</text>
  <text x="300" y="68" fill="#64748b" font-size="8">ascii-profile-card charset param · ascii-portrait ramp</text>
</g>
</svg>
