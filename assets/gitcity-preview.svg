<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160" viewBox="0 0 680 160" role="img">
<title>GitCity interactive</title><desc>driveable city preview</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} @keyframes drive{from{transform:translateX(0)}to{transform:translateX(400px)}} .car{animation:drive 3s linear infinite}</style>
<rect width="680" height="160" rx="16" fill="#020617"/>
<text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">GITCITY — driveable city · gitcity.natrajx.in</text>
<g transform="translate(20,40)">
  <rect width="640" height="60" rx="6" fill="#1e293b"/>
  <g transform="translate(10,10)">
    <rect width="24" height="24" rx="2" fill="#22c55e"/><rect x="28" width="24" height="36" rx="2" fill="#16a34a"/><rect x="56" width="24" height="48" rx="2" fill="#15803d"/>
    <text x="100" y="18" fill="#e2e8f0" font-family="monospace" font-size="10">🚗 drive mode — Three.js · Matrix/Noir/Aurora/Ocean/Gold/Ice</text>
  </g>
  <g class="car"><text x="10" y="92" font-size="18">🚗</text></g>
</g>
</svg>
