<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="gitEdit — Конструктор вау-оформления GitHub">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#15132B"/>
      <stop offset="100%" stop-color="#0E1E2E"/>
    </linearGradient>
    <linearGradient id="txtGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="lineD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbD" cx="84%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipD"><rect width="1200" height="260" rx="18"/></clipPath>
    <style>
      .tag { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #38BDF8; letter-spacing: 2.2px; }
      .h1 { font: 800 52px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: url(#txtGradD); }
      .desc { font: 400 17.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #CBD5E1; }
      .code { font: 600 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #A78BFA; }
      .pill { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #E2E8F0; }
      .float-cards { animation: floatY 4.4s ease-in-out infinite; }
      .blink { animation: cur 1.1s steps(2, start) infinite; }
      @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes cur { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    </style>
  </defs>
  <g clip-path="url(#clipD)">
    <rect width="1200" height="260" fill="url(#bgD)"/>
    <rect width="1200" height="260" fill="url(#orbD)"/>
    <path fill="#8B5CF6" fill-opacity="0.09">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,218 C320,192 640,250 960,214 C1080,200 1150,212 1200,220 L1200,260 L0,260 Z;
                M0,228 C320,252 640,194 960,228 C1080,240 1150,220 1200,212 L1200,260 L0,260 Z;
                M0,218 C320,192 640,250 960,214 C1080,200 1150,212 1200,220 L1200,260 L0,260 Z"/>
    </path>

    <!-- Decorative floating badge stack on the right -->
    <g class="float-cards" transform="translate(880, 56)">
      <rect x="0" y="0" width="248" height="36" rx="7" fill="#1E293B" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <rect x="0" y="0" width="76" height="36" rx="7" fill="#8B5CF6"/>
      <text x="16" y="23" class="pill" fill="#FFFFFF">Shields</text>
      <text x="90" y="23" class="pill">SVG Badges &amp; Icons</text>

      <rect x="22" y="50" width="248" height="36" rx="7" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.6"/>
      <rect x="22" y="50" width="84" height="36" rx="7" fill="#0284C7"/>
      <text x="36" y="73" class="pill" fill="#FFFFFF">Mermaid</text>
      <text x="118" y="73" class="pill">Live Flowcharts</text>

      <rect x="-8" y="100" width="256" height="36" rx="7" fill="#1E293B" stroke="#22C55E" stroke-opacity="0.6"/>
      <rect x="-8" y="100" width="82" height="36" rx="7" fill="#16A34A"/>
      <text x="8" y="123" class="pill" fill="#FFFFFF">Actions</text>
      <text x="86" y="123" class="pill">Snake &amp; Auto-Unpack</text>
    </g>

    <rect x="52" y="34" width="32" height="2.5" fill="#38BDF8"/>
    <text x="94" y="39" class="tag">GITHUB PORTFOLIO DESIGN KIT · DARK MODE</text>
    <text x="52" y="102" class="h1">gitEdit</text>
    <rect x="52" y="118" width="520" height="2" fill="url(#lineD)"/>
    <text x="52" y="150" class="desc">Шпаргалка, живые витрины и готовые шаблоны вау-оформления GitHub</text>
    <text x="52" y="182" class="code">&gt; Badges · Skill Icons · Typing SVG · Mermaid · Alerts · Profile Snake <tspan class="blink" fill="#38BDF8">▋</tspan></text>

    <g transform="translate(52, 204)">
      <rect x="0" y="0" width="166" height="30" rx="7" fill="#FFFFFF" fill-opacity="0.06" stroke="#8B5CF6" stroke-opacity="0.45"/>
      <text x="14" y="19.5" class="pill">Copy &amp; Paste блоки</text>
      <rect x="178" y="0" width="176" height="30" rx="7" fill="#FFFFFF" fill-opacity="0.06" stroke="#38BDF8" stroke-opacity="0.45"/>
      <text x="192" y="19.5" class="pill">2 готовых шаблона</text>
      <rect x="366" y="0" width="194" height="30" rx="7" fill="#FFFFFF" fill-opacity="0.06" stroke="#22C55E" stroke-opacity="0.45"/>
      <text x="380" y="19.5" class="pill">Авто-распаковка .zip</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="17.5" fill="none" stroke="#8B5CF6" stroke-opacity="0.32" stroke-width="1.5"/>
  </g>
</svg>
