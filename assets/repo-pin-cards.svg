<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" role="img">
<title>Repo pin cards</title><desc>2 pinned repos</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} .card{animation:lift .4s forwards;transform:translateY(10px);opacity:0} @keyframes lift{to{transform:translateY(0);opacity:1}}</style>
<rect width="680" height="150" rx="16" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-family="monospace" font-size="12">REPO PIN — github-readme-stats pin card</text>
<g transform="translate(20,40)">
  <g class="card" style="animation-delay:.1s"><rect width="310" height="80" rx="10" fill="#161b22" stroke="#30363d"/><text x="14" y="24" fill="#58a6ff" font-family="monospace" font-size="12">📦 gitEdit</text><text x="14" y="44" fill="#7d8590" font-family="monospace" font-size="9">мастерская оформления README — склад крутого</text><text x="14" y="64" fill="#7d8590" font-family="monospace" font-size="9">● Python  ★ 12</text></g>
  <g class="card" style="animation-delay:.3s" transform="translate(330,0)"><rect width="310" height="80" rx="10" fill="#161b22" stroke="#30363d"/><text x="14" y="24" fill="#58a6ff" font-family="monospace" font-size="12">📦 MyWorkAiBrain</text><text x="14" y="44" fill="#7d8590" font-family="monospace" font-size="9">AI work + GLB ship model</text><text x="14" y="64" fill="#7d8590" font-family="monospace" font-size="9">● TS  ★ 34</text></g>
</g>
</svg>
