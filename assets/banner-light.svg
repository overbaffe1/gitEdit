<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="gitEdit — Конструктор вау-оформления GitHub">
  <defs>
    <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="txtGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="lineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipL"><rect width="1200" height="260" rx="18"/></clipPath>
    <style>
      .tag { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0284C7; letter-spacing: 2.2px; }
      .h1 { font: 800 52px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: url(#txtGradL); }
      .desc { font: 400 17.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #334155; }
      .code { font: 600 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6D28D9; }
      .pill { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1E293B; }
      .float-cards { animation: floatY 4.4s ease-in-out infinite; }
      .blink { animation: cur 1.1s steps(2, start) infinite; }
      @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes cur { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    </style>
  </defs>
  <g clip-path="url(#clipL)">
    <rect width="1200" height="260" fill="url(#bgL)"/>
    <path fill="#7C3AED" fill-opacity="0.06">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,218 C320,192 640,250 960,214 C1080,200 1150,212 1200,220 L1200,260 L0,260 Z;
                M0,228 C320,252 640,194 960,228 C1080,240 1150,220 1200,212 L1200,260 L0,260 Z;
                M0,218 C320,192 640,250 960,214 C1080,200 1150,212 1200,220 L1200,260 L0,260 Z"/>
    </path>

    <g class="float-cards" transform="translate(880, 56)">
      <rect x="0" y="0" width="248" height="36" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.45"/>
      <rect x="0" y="0" width="76" height="36" rx="7" fill="#7C3AED"/>
      <text x="16" y="23" class="pill" fill="#FFFFFF">Shields</text>
      <text x="90" y="23" class="pill">SVG Badges &amp; Icons</text>

      <rect x="22" y="50" width="248" height="36" rx="7" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.45"/>
      <rect x="22" y="50" width="84" height="36" rx="7" fill="#0284C7"/>
      <text x="36" y="73" class="pill" fill="#FFFFFF">Mermaid</text>
      <text x="118" y="73" class="pill">Live Flowcharts</text>

      <rect x="-8" y="100" width="256" height="36" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-opacity="0.45"/>
      <rect x="-8" y="100" width="82" height="36" rx="7" fill="#16A34A"/>
      <text x="8" y="123" class="pill" fill="#FFFFFF">Actions</text>
      <text x="86" y="123" class="pill">Snake &amp; Auto-Unpack</text>
    </g>

    <rect x="52" y="34" width="32" height="2.5" fill="#0284C7"/>
    <text x="94" y="39" class="tag">GITHUB PORTFOLIO DESIGN KIT · LIGHT MODE</text>
    <text x="52" y="102" class="h1">gitEdit</text>
    <rect x="52" y="118" width="520" height="2" fill="url(#lineL)"/>
    <text x="52" y="150" class="desc">Шпаргалка, живые витрины и готовые шаблоны вау-оформления GitHub</text>
    <text x="52" y="182" class="code">&gt; Badges · Skill Icons · Typing SVG · Mermaid · Alerts · Profile Snake <tspan class="blink" fill="#0284C7">▋</tspan></text>

    <g transform="translate(52, 204)">
      <rect x="0" y="0" width="166" height="30" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.35"/>
      <text x="14" y="19.5" class="pill">Copy &amp; Paste блоки</text>
      <rect x="178" y="0" width="176" height="30" rx="7" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.35"/>
      <text x="192" y="19.5" class="pill">2 готовых шаблона</text>
      <rect x="366" y="0" width="194" height="30" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-opacity="0.35"/>
      <text x="380" y="19.5" class="pill">Авто-распаковка .zip</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="17.5" fill="none" stroke="#7C3AED" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>
</svg>
