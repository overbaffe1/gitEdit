<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="gitEdit — Конструктор вау-оформления GitHub">
  <defs>
    <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="txtGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="lineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbL" cx="83%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipL"><rect width="1200" height="260" rx="18"/></clipPath>
    <clipPath id="b1L"><rect x="0" y="0" width="262" height="38" rx="8"/></clipPath>
    <clipPath id="b2L"><rect x="20" y="52" width="262" height="38" rx="8"/></clipPath>
    <clipPath id="b3L"><rect x="6" y="104" width="262" height="38" rx="8"/></clipPath>
    <style>
      .tag { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0284C7; letter-spacing: 2.2px; }
      .h1 { font: 800 52px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: url(#txtGradL); }
      .desc { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #334155; }
      .code { font: 600 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6D28D9; }
      .pill { font: 600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1E293B; }
      .b-lbl { font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #FFFFFF; }
      .b-val { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1E293B; }
    </style>
  </defs>

  <g clip-path="url(#clipL)">
    <rect width="1200" height="260" fill="url(#bgL)"/>
    <rect width="1200" height="260" fill="url(#orbL)"/>

    <path fill="#7C3AED" fill-opacity="0.06">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,218 C320,192 640,250 960,214 C1080,200 1150,212 1200,220 L1200,260 L0,260 Z;
                M0,228 C320,252 640,194 960,228 C1080,240 1150,220 1200,212 L1200,260 L0,260 Z;
                M0,218 C320,192 640,250 960,214 C1080,200 1150,212 1200,220 L1200,260 L0,260 Z"/>
    </path>

    <!-- Decorative floating badge stack on the right (pure SMIL translate inside outer group!) -->
    <g transform="translate(866, 58)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,3; 0,-6; 0,3" dur="4.4s" repeatCount="indefinite"/>

        <g clip-path="url(#b1L)">
          <rect x="0" y="0" width="262" height="38" fill="#FFFFFF"/>
          <rect x="0" y="0" width="84" height="38" fill="#7C3AED"/>
          <text x="42" y="23.5" text-anchor="middle" class="b-lbl">Shields</text>
          <text x="173" y="23.5" text-anchor="middle" class="b-val">SVG Badges &amp; Icons</text>
        </g>
        <rect x="0.5" y="0.5" width="261" height="37" rx="7.5" fill="none" stroke="#7C3AED" stroke-opacity="0.45"/>

        <g clip-path="url(#b2L)">
          <rect x="20" y="52" width="262" height="38" fill="#FFFFFF"/>
          <rect x="20" y="52" width="88" height="38" fill="#0284C7"/>
          <text x="64" y="75.5" text-anchor="middle" class="b-lbl">Mermaid</text>
          <text x="195" y="75.5" text-anchor="middle" class="b-val">Vector Diagrams</text>
        </g>
        <rect x="20.5" y="52.5" width="261" height="37" rx="7.5" fill="none" stroke="#0284C7" stroke-opacity="0.45"/>

        <g clip-path="url(#b3L)">
          <rect x="6" y="104" width="262" height="38" fill="#FFFFFF"/>
          <rect x="6" y="104" width="84" height="38" fill="#16A34A"/>
          <text x="48" y="127.5" text-anchor="middle" class="b-lbl">Profile</text>
          <text x="179" y="127.5" text-anchor="middle" class="b-val">Commit Snake &amp; Kit</text>
        </g>
        <rect x="6.5" y="104.5" width="261" height="37" rx="7.5" fill="none" stroke="#16A34A" stroke-opacity="0.45"/>
      </g>
    </g>

    <!-- Left editorial block -->
    <rect x="52" y="34" width="32" height="2.5" fill="#0284C7"/>
    <text x="94" y="39" class="tag">GITHUB VISUAL DESIGN &amp; PORTFOLIO KIT</text>

    <text x="52" y="102" class="h1">gitEdit</text>
    <rect x="52" y="118" width="520" height="2" fill="url(#lineL)"/>

    <text x="52" y="150" class="desc">Шпаргалка, живые витрины и готовые шаблоны вау-оформления GitHub</text>

    <text x="52" y="182" class="code">
      &gt; Badges · Skill Icons · Typing SVG · Mermaid · Alerts · Profile Snake
      <tspan fill="#0284C7">▋<animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>

    <g transform="translate(52, 204)">
      <rect x="0" y="0" width="186" height="32" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.38"/>
      <text x="93" y="20.5" text-anchor="middle" class="pill">Copy &amp; Paste витрина</text>

      <rect x="198" y="0" width="246" height="32" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.38"/>
      <text x="321" y="20.5" text-anchor="middle" class="pill">Шаблоны проекта и профиля</text>

      <rect x="456" y="0" width="214" height="32" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-opacity="0.38"/>
      <text x="563" y="20.5" text-anchor="middle" class="pill">Тёмная и светлая темы</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="17.5" fill="none" stroke="#7C3AED" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>
</svg>
