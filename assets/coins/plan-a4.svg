<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="sans-serif" fill="#263039"><text x="18" y="20" font-size="6">TWELVE COINS / THREE WEIGHINGS</text><text x="18" y="32" font-size="3.6">A4, print 100%. Exactly one odd coin: heavy OR light.</text><text x="18" y="50" font-size="4.5">1. LEFT: 8, 9, 10, 12 / RIGHT: 5, 6, 7, 11</text><text x="18" y="67" font-size="4.5">2. LEFT: 5, 6, 10, 12 / RIGHT: 2, 3, 4, 11</text><text x="18" y="84" font-size="4.5">3. LEFT: 2, 7, 9, 12 / RIGHT: 1, 4, 6, 10</text><text x="18" y="108" font-size="3.6">Record L (left heavier), R (right heavier), = (balanced).</text><text x="18" y="118" font-size="3.6">Then find the three-result trace below. Do not change the plan.</text><text x="18" y="135" font-size="4">= = R : coin 1, heavy</text><text x="18" y="145" font-size="4">= = L : coin 1, light</text><text x="18" y="155" font-size="4">= R L : coin 2, heavy</text><text x="18" y="165" font-size="4">= L R : coin 2, light</text><text x="18" y="175" font-size="4">= R = : coin 3, heavy</text><text x="18" y="185" font-size="4">= L = : coin 3, light</text><text x="18" y="195" font-size="4">= R R : coin 4, heavy</text><text x="18" y="205" font-size="4">= L L : coin 4, light</text><text x="18" y="215" font-size="4">R L = : coin 5, heavy</text><text x="18" y="225" font-size="4">L R = : coin 5, light</text><text x="18" y="235" font-size="4">R L R : coin 6, heavy</text><text x="18" y="245" font-size="4">L R L : coin 6, light</text><text x="110" y="135" font-size="4">R = L : coin 7, heavy</text><text x="110" y="145" font-size="4">L = R : coin 7, light</text><text x="110" y="155" font-size="4">L = = : coin 8, heavy</text><text x="110" y="165" font-size="4">R = = : coin 8, light</text><text x="110" y="175" font-size="4">L = L : coin 9, heavy</text><text x="110" y="185" font-size="4">R = R : coin 9, light</text><text x="110" y="195" font-size="4">L L R : coin 10, heavy</text><text x="110" y="205" font-size="4">R R L : coin 10, light</text><text x="110" y="215" font-size="4">R R = : coin 11, heavy</text><text x="110" y="225" font-size="4">L L = : coin 11, light</text><text x="110" y="235" font-size="4">L L L : coin 12, heavy</text><text x="110" y="245" font-size="4">R R R : coin 12, light</text><text x="18" y="270" font-size="3.5">Other traces: incompatible with this exact one-odd-coin model.</text><text x="18" y="280" font-size="3.5">Paper labels are not weights. A physical trial needs suitable scales.</text></g></svg>
