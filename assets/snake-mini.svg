<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160" viewBox="0 0 680 160" role="img">
<title>Snake mini</title><desc>snake eats green squares 2s loop</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} @keyframes slither{0%{transform:translateX(0)}25%{transform:translateX(120px)}50%{transform:translateX(240px)}75%{transform:translateX(360px)}100%{transform:translateX(480px)}} .snake{animation:slither 3s linear infinite}</style>
<rect width="680" height="160" rx="16" fill="#020617"/>
<text x="20" y="28" fill="#22c55e" font-family="monospace" font-size="12">SNAKE — contribution eater (mini)</text>
<g transform="translate(20,50)">
  <rect x="0" y="0" width="28" height="28" rx="4" fill="#14532d"/><rect x="36" y="0" width="28" height="28" rx="4" fill="#4ade80"/><rect x="72" y="0" width="28" height="28" rx="4" fill="#22c55e"/><rect x="108" y="0" width="28" height="28" rx="4" fill="#14532d"/><rect x="144" y="0" width="28" height="28" rx="4" fill="#22c55e"/><rect x="180" y="0" width="28" height="28" rx="4" fill="#4ade80"/><rect x="216" y="0" width="28" height="28" rx="4" fill="#14532d"/><rect x="252" y="0" width="28" height="28" rx="4" fill="#4ade80"/><rect x="288" y="0" width="28" height="28" rx="4" fill="#22c55e"/><rect x="324" y="0" width="28" height="28" rx="4" fill="#14532d"/><rect x="360" y="0" width="28" height="28" rx="4" fill="#22c55e"/><rect x="396" y="0" width="28" height="28" rx="4" fill="#4ade80"/><rect x="432" y="0" width="28" height="28" rx="4" fill="#14532d"/><rect x="468" y="0" width="28" height="28" rx="4" fill="#4ade80"/>
  <g class="snake"><rect x="0" y="4" width="52" height="20" rx="6" fill="#facc15" stroke="#422006"/><circle cx="44" cy="14" r="3" fill="#000"/></g>
</g>
<text x="20" y="138" fill="#64748b" font-family="monospace" font-size="9">Platane/snk alternative · daily GitHub Action → output branch</text>
</svg>
