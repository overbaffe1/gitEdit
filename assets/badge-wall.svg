<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" role="img">
<title>Badge wall</title><desc>12 badges fade</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}} .b{opacity:0;animation:fade .3s forwards} @keyframes fade{to{opacity:1}}</style>
<rect width="680" height="150" rx="16" fill="#020617"/>
<text x="20" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">BADGE WALL — shields.io + Simple Icons</text>
<g transform="translate(20,44)" font-family="monospace" font-size="10">
  <g class="b" style="animation-delay:.07s" transform="translate(0,0)"><rect width="100" height="20" rx="4" fill="#3776AB"/><text x="50" y="13" text-anchor="middle" fill="white">python</text></g>
  <g class="b" style="animation-delay:.14s" transform="translate(108,0)"><rect width="100" height="20" rx="4" fill="#3178C6"/><text x="50" y="13" text-anchor="middle" fill="white">typescript</text></g>
  <g class="b" style="animation-delay:.21s" transform="translate(216,0)"><rect width="100" height="20" rx="4" fill="#000"/><text x="50" y="13" text-anchor="middle" fill="white">rust</text></g>
  <g class="b" style="animation-delay:.28s" transform="translate(324,0)"><rect width="100" height="20" rx="4" fill="#2496ED"/><text x="50" y="13" text-anchor="middle" fill="white">docker</text></g>
  <g class="b" style="animation-delay:.35s" transform="translate(432,0)"><rect width="100" height="20" rx="4" fill="#4169E1"/><text x="50" y="13" text-anchor="middle" fill="white">postgres</text></g>
  <g class="b" style="animation-delay:.42s" transform="translate(0,28)"><rect width="100" height="20" rx="4" fill="#EA7600"/><text x="50" y="13" text-anchor="middle" fill="white">blender</text></g>
</g>
</svg>
