<text x="36" y="64" fill="#263b49" font-family="DejaVu Sans,Arial,sans-serif" font-size="46" font-weight="700">СЦЕНА ПО СЛОЯМ</text>
<text x="36" y="108" fill="#263b49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" >Один контур. Пять цветов. Шестой лист — задник.</text>
