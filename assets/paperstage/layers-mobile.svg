<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1680" viewBox="0 0 720 1680" role="img" aria-labelledby="title desc">
<title id="title">Сцена по слоям</title><desc id="desc">Те же пять арочных рам и шестой сплошной задник показаны отдельно. Это объяснение композиции, не выкройка и не инструкция по изготовлению.</desc>
<rect width="720" height="1680" fill="#eee7e2"/>
<text x="36" y="64" fill="#263b49" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">СЦЕНА ПО СЛОЯМ</text>
<text x="36" y="108" fill="#263b49" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" >Один контур. Пять цветов. Шестой лист — задник.</text>
