<title id="title">Бумажная сцена</title><desc id="desc">Пять цветных арок перед тёмным задником с оранжевым диском. Небольшая лестница ведёт внутрь. Собственная плоская векторная иллюстрация с условной глубиной, не фотография макета.</desc>
