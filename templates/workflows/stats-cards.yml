# Stats cards — self-hosted, без внешних серверов
name: Update Stats Cards
on:
  schedule: [{cron: "0 1 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r atlas/samples/requirements.txt || true
      - run: python3 atlas/samples/render-stats-cards.py
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
      - run: |
          git config user.name "github-actions[bot]"
          git add assets/stats-*.svg assets/streak*.svg
          git commit -m "chore: refresh stats [skip ci]" || exit 0
          git push
