name: Нативная песочница — можно не отправлять
description: Изучи поля и списки GitHub Issue Forms. Для демонстрации не нужно создавать Issue.
title: '[Песочница] '
body:
  - type: markdown
    attributes:
      value: |
        ## Это настоящая форма GitHub, не картинка
        Можно менять списки, поля и флажки. **Для демонстрации ничего отправлять не нужно — просто закрой страницу.**
        Если нажать Create/Submit issue и пройти проверки, будет создана настоящая публичная запись.
        Не вводи пароли, токены и личные данные. Не прикрепляй файлы: загрузка вложения может начаться до отправки формы.
  - type: input
    id: callsign
    attributes:
      label: Позывной для опыта
      description: Любое вымышленное слово. Это обязательное поле, но не запрос имени или контакта.
      placeholder: Например, Лунный архивариус
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Какую поверхность исследуем?
      description: Одиночный выбор. Это демонстрация поля, не команда настройки репозитория.
      options:
        - README с нативными блоками
        - Просмотрщик файла GitHub
        - История изменений
    validations:
      required: true
  - type: dropdown
    id: mechanisms
    attributes:
      label: Какие механики интересны?
      description: Можно выбрать несколько вариантов. Список не изменяет остальные поля автоматически.
      multiple: true
      options:
        - Вращение STL
        - Карта GeoJSON
        - Схема Mermaid
        - Сравнение изображений
        - Визуальный diff документа
  - type: textarea
    id: observation
    attributes:
      label: Черновик с Markdown
      description: Необязательный вымышленный текст. Не прикрепляй приватные файлы и не используй поле как хранилище.
      placeholder: Можно написать **жирный текст** или список. Для просмотра формы отправка не нужна.
  - type: textarea
    id: specimen
    attributes:
      label: Фрагмент для кодового блока
      description: После отправки render оформляет текст как JSON-код. Это не проверка JSON, не выполнение кода и не калькулятор.
      render: json
      value: |
        {"experiment": "native-ui", "sample": true}
  - type: checkboxes
    id: switches
    attributes:
      label: Настоящие переключаемые флажки
      description: В отличие от списка состояний в README, это элементы редактируемой формы. Отметки не меняют репозиторий сами по себе.
      options:
        - label: Попробовал одиночный выбор
        - label: Попробовал множественный выбор
        - label: Изменил текстовое поле
  - type: checkboxes
    id: publish_ack
    attributes:
      label: Только если действительно собираешься отправить Issue
      description: Не отмечай и не отправляй ради демонстрации. Для реальной отправки требуется это подтверждение.
      options:
        - label: Я понимаю, что отправка создаёт публичную запись; не добавляю секреты и персональные данные.
          required: true
  - type: markdown
    attributes:
      value: |
        **Опыт закончен: можно просто закрыть эту страницу.** Форма не запускает workflows, не строит модели и не делает коммиты.
        Не рассчитывай на сохранение черновика или отсутствие сетевых запросов: редактирование происходит в интерфейсе GitHub.
